[package]
name = "ciel-rs"
version = "3.11.2"
description = "An nspawn container manager for distro packaging"
license = "MIT"
authors = ["liushuyu <liushuyu011@gmail.com>"]
repository = "https://github.com/AOSC-Dev/ciel-rs"
resolver = "2"
edition = "2021"

[features]
default = ["nspawn"]
# nspawn: upstream systemd-nspawn backend (systemd, D-Bus, machined)
nspawn = ["dep:zbus", "dep:libsystemd-sys", "dep:libmount", "dep:xattr"]
# proot: portable backend for Termux/Android (no mount(2), no systemd, no D-Bus)
proot = []

[dependencies]
console = "0.16"
zbus = { version = "^5", optional = true }
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
indicatif = "0.18"
nix = { version = "0.31", features = ["fs", "hostname", "mount", "user"] }
toml = "^1"
wincode = { version = "0.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
git2 = "0.21"
tar = "0.4"
xz2 = "0.1"
libmount = { git = "https://github.com/liushuyu/libmount", rev = "6fe8dba03a6404dfe1013995dd17af1c4e21c97b", optional = true }
libc = "0.2"
adler32 = "1.2"
rayon = "1.12"
tempfile = "3.27"
anyhow = "1.0"
libsystemd-sys = { version = "0.9", optional = true }
walkdir = "2"
xattr = { version = "^1", optional = true }
rand = "0.10"
dotenvy = "0.15"
which = "8.0"
sha2 = "0.11"
digest-io = "0.1"
time = { version = "0.3", default-features = false, features = ["serde-human-readable", "macros"] }
fs3 = "0.5"
clap = { version = "^4", features = ["wrap_help", "string", "env"] }
ctrlc = "^3"
# repo scan
ar = "0.9"
faster-hex = "0.10"
flate2 = "1.1"
tabwriter = { version = "^1", features = ["ansi_formatting"] }
inotify = "0.11"
zstd = "0.13"
ureq = { version = "^3", features = ["json"] }

[build-dependencies]
clap = { version = "^4", features = ["string", "env"] }
clap_complete = "^4"
anyhow = "^1"

[profile.release]
lto = true
